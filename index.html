<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent; /* OBS背景透過 */
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 1500px;
      height: 500px;
    }
    .slideshow-container {
      position: relative;
      width: 1500px;
      height: 500px;
      overflow: hidden;
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 1500px;
      height: 500px;
      object-fit: cover; /* 1500x500pxに綺麗に収める */
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    .slide.active {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="slideshow-container" id="slideshow"></div>

<script>
  // 設定済みのAPIキーとフォルダID
  const API_KEY = 'AIzaSyA8Hr2SgKOA7RwPBQ-GcvSVDAvHQhjQwZ4';
  const FOLDER_ID = '1MrcjXWF4TNs3k9Evk53tOu1Ss0bCIkcx';

  const DISPLAY_TIME = 8000; // 画像の表示時間（5秒）
  const RELOAD_INTERVAL = 300000; // 5分ごとにドライブの更新を自動チェック

  let slides = [];
  let currentIndex = 0;
  let timer = null;

  async function fetchImages() {
    const query = `'${FOLDER_ID}' in parents and mimeType contains 'image/' and trashed = false`;
    const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name)&key=${API_KEY}`;

    try {
      const response = await fetch(url);
      const data = await response.json();
      if (data.files && data.files.length > 0) {
        renderSlideshow(data.files);
      }
    } catch (error) {
      console.error('Failed to fetch images from Google Drive:', error);
    }
  }

  function renderSlideshow(files) {
    const container = document.getElementById('slideshow');
    container.innerHTML = '';
    
    files.forEach((file, index) => {
      const img = document.createElement('img');
      // 高画質（横幅1920px基準）で画像を取得
      img.src = `https://drive.google.com/thumbnail?id=${file.id}&sz=w1920`;
      img.className = 'slide' + (index === 0 ? ' active' : '');
      container.appendChild(img);
    });

    slides = document.querySelectorAll('.slide');
    currentIndex = 0;

    if (timer) clearInterval(timer);
    if (slides.length > 1) {
      timer = setInterval(nextSlide, DISPLAY_TIME);
    }
  }

  function nextSlide() {
    if (slides.length <= 1) return;
    slides[currentIndex].classList.remove('active');
    currentIndex = (currentIndex + 1) % slides.length;
    slides[currentIndex].classList.add('active');
  }

  fetchImages();
  setInterval(fetchImages, RELOAD_INTERVAL);
</script>

</body>
</html>
