<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: transparent; /* OBS背景透過 */
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 1500px;
      height: 500px;
    }
    .slideshow-container {
      position: relative;
      width: 1500px;
      height: 500px;
      overflow: hidden; /* 画面外の画像は隠す */
    }
    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 1500px;
      height: 500px;
      object-fit: cover;
      /* 横スライド用の初期位置設定（右側に配置＆透明化） */
      transform: translateX(100%);
      opacity: 0;
      transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out;
    }
    /* 現在表示中：中央 */
    .slide.active {
      transform: translateX(0);
      opacity: 1;
    }
    /* 退場時：左側に抜ける */
    .slide.exit {
      transform: translateX(-100%);
      opacity: 0;
    }
  </style>
</head>
<body>

<div class="slideshow-container" id="slideshow"></div>

<script>
  const API_KEY = 'AIzaSyA8Hr2SgKOA7RwPBQ-GcvSVDAvHQhjQwZ4';
  const FOLDER_ID = '1MrcjXWF4TNs3k9Evk53tOu1Ss0bCIkcx';

  const DISPLAY_TIME = 5000; // 各画像の表示時間（5秒）
  const RELOAD_INTERVAL = 300000; // ドライブの自動更新チェック（5分）

  let slides = [];
  let currentIndex = 0;
  let timer = null;

  async function fetchImages() {
    const query = `'${FOLDER_ID}' in parents and mimeType contains 'image/' and trashed = false`;
    const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name)&key=${API_KEY}`;

    try {
      const response = await fetch(url);
      const data = await response.json();
      if (data.files && data.files.length > 0) {
        renderSlideshow(data.files);
      }
    } catch (error) {
      console.error('Failed to fetch images from Google Drive:', error);
    }
  }

  function renderSlideshow(files) {
    const container = document.getElementById('slideshow');
    container.innerHTML = '';
    
    files.forEach((file, index) => {
      const img = document.createElement('img');
      img.src = `https://drive.google.com/thumbnail?id=${file.id}&sz=w1920`;
      img.className = 'slide' + (index === 0 ? ' active' : '');
      container.appendChild(img);
    });

    slides = document.querySelectorAll('.slide');
    currentIndex = 0;

    if (timer) clearInterval(timer);
    if (slides.length > 1) {
      timer = setInterval(nextSlide, DISPLAY_TIME);
    }
  }

  function nextSlide() {
    if (slides.length <= 1) return;

    const currentSlide = slides[currentIndex];
    currentIndex = (currentIndex + 1) % slides.length;
    const nextSlideElement = slides[currentIndex];

    // 現在の画像を左へ画面外に送り出す
    currentSlide.classList.remove('active');
    currentSlide.classList.add('exit');

    // 次の画像を右側から中央へ移動させる
    nextSlideElement.classList.remove('exit');
    nextSlideElement.classList.add('active');

    // 送り出しアニメーションが終わったら位置リセット（クラスの削除）
    setTimeout(() => {
      currentSlide.classList.remove('exit');
    }, 800);
  }

  fetchImages();
  setInterval(fetchImages, RELOAD_INTERVAL);
</script>

</body>
</html>
